# Optional: turn on sign-in with your own OpenID Connect (OIDC) provider.
#
# The default stack runs in local mode without sign-in. This file adds no
# identity provider; it only passes your settings from .env to SamuraiBFF.
# Keycloak, and any other OIDC provider, must be run and secured by you.
# See docs/authentication.md.
#
#   docker compose -f docker-compose.yml -f docker-compose.sign-in.yml up -d
#
# Published ports stay on COMPOSE_BIND_IP (127.0.0.1 by default).
services:
  samuraibff:
    environment:
      SAMURAIBFF_AUTH_REQUIRED: "true"
      SAMURAIBFF_AUTH_ISSUER: ${SAMURAIBFF_AUTH_ISSUER:?Set SAMURAIBFF_AUTH_ISSUER in .env to your provider's issuer URL}
      SAMURAIBFF_AUTH_AUDIENCE: ${SAMURAIBFF_AUTH_AUDIENCE:-bff-web}
      SAMURAIBFF_AUTH_CLIENT_ID: ${SAMURAIBFF_AUTH_CLIENT_ID:-bff-web}
      SAMURAIBFF_AUTH_TENANT_CLAIM: ${SAMURAIBFF_AUTH_TENANT_CLAIM:-tenant_id}
      SAMURAIBFF_AUTH_CLIENT_CLAIM: ${SAMURAIBFF_AUTH_CLIENT_CLAIM:-azp}
      SAMURAIBFF_AUTH_ALLOWED_ORIGINS: ${SAMURAIBFF_AUTH_ALLOWED_ORIGINS:-}
      SAMURAIBFF_ORIGIN_URI: ${SAMURAIBFF_PUBLIC_ORIGIN_URI:-http://localhost:8000}
      SAMURAIBFF_PUBLIC_ORIGIN_URI: ${SAMURAIBFF_PUBLIC_ORIGIN_URI:-http://localhost:8000}
      # Optional Keycloak adapter: create and rotate API keys in the app.
      SAMURAIBFF_KEYCLOAK_ADMIN_ISSUER: ${SAMURAIBFF_KEYCLOAK_ADMIN_ISSUER:-}
      SAMURAIBFF_KEYCLOAK_ADMIN_REALM: ${SAMURAIBFF_KEYCLOAK_ADMIN_REALM:-}
      SAMURAIBFF_KEYCLOAK_ADMIN_CLIENT_ID: ${SAMURAIBFF_KEYCLOAK_ADMIN_CLIENT_ID:-}
      SAMURAIBFF_KEYCLOAK_ADMIN_CLIENT_SECRET: ${SAMURAIBFF_KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      # Optional Keycloak adapter: add people in the app (setup email).
      SAMURAIBFF_KEYCLOAK_USER_ADMIN_ENABLED: ${SAMURAIBFF_KEYCLOAK_USER_ADMIN_ENABLED:-false}
      SAMURAIBFF_KEYCLOAK_USER_ADMIN_ISSUER: ${SAMURAIBFF_KEYCLOAK_USER_ADMIN_ISSUER:-}
      SAMURAIBFF_KEYCLOAK_USER_ADMIN_REALM: ${SAMURAIBFF_KEYCLOAK_USER_ADMIN_REALM:-}
      SAMURAIBFF_KEYCLOAK_USER_ADMIN_CLIENT_ID: ${SAMURAIBFF_KEYCLOAK_USER_ADMIN_CLIENT_ID:-}
      SAMURAIBFF_KEYCLOAK_USER_ADMIN_CLIENT_SECRET: ${SAMURAIBFF_KEYCLOAK_USER_ADMIN_CLIENT_SECRET:-}
      SAMURAIBFF_KEYCLOAK_USER_ADMIN_SETUP_CLIENT_ID: ${SAMURAIBFF_KEYCLOAK_USER_ADMIN_SETUP_CLIENT_ID:-}
      SAMURAIBFF_KEYCLOAK_USER_ADMIN_SETUP_REDIRECT_URI: ${SAMURAIBFF_KEYCLOAK_USER_ADMIN_SETUP_REDIRECT_URI:-}
      SAMURAIBFF_KEYCLOAK_USER_ADMIN_SETUP_LIFESPAN_S: ${SAMURAIBFF_KEYCLOAK_USER_ADMIN_SETUP_LIFESPAN_S:-86400}

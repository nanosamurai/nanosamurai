services:
  samuraibff:
    environment:
      SAMURAIBFF_GRPC_REALTIME_TRACKS: faster-whisper=rtservice:50052,qwen=qwen-rtservice:50052
    depends_on:
      qwen-rtservice:
        condition: service_healthy

  qwen-rtservice:
    image: ${QWEN_RTSERVICE_IMAGE:?Set QWEN_RTSERVICE_IMAGE to an immutable xamurai-qwen-rtservice image}
    restart: unless-stopped
    environment:
      QWEN_RTSERVICE_PORT: "50052"
      QWEN_STREAM_CHUNK_SECONDS: "${QWEN_STREAM_CHUNK_SECONDS:-2.0}"
      QWEN_STREAM_EPOCH_SECONDS: "${QWEN_STREAM_EPOCH_SECONDS:-120.0}"
      QWEN_EPOCH_CONTEXT_CHARACTERS: "${QWEN_EPOCH_CONTEXT_CHARACTERS:-1000}"
      QWEN_MAX_NEW_TOKENS: "${QWEN_MAX_NEW_TOKENS:-1024}"
      QWEN_MAX_MODEL_LEN: "${QWEN_MAX_MODEL_LEN:-4096}"
      QWEN_KV_CACHE_MIB: "${QWEN_KV_CACHE_MIB:-512}"
      HF_HOME: /data/huggingface
      XDG_CACHE_HOME: /data/huggingface/runtime-cache
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      VLLM_NO_USAGE_STATS: "1"
    volumes:
      - nanosamurai_qwen_hf_cache:/data/huggingface
    gpus: all
    shm_size: 4gb

volumes:
  nanosamurai_qwen_hf_cache:

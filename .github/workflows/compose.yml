name: compose

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configurations
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.nemotron-smoke.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.whisper.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.whisper.yml -f docker-compose.parakeet-smoke.yml config --quiet
          HF_TOKEN=validation-placeholder docker compose -f docker-compose.yml -f docker-compose.qwen.yml -f docker-compose.qwen-workers.yml -f docker-compose.default-tracks-smoke.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.observability.yml config --quiet
          SAMURAIBFF_AUTH_ISSUER=https://id.example.com/realms/validation docker compose -f docker-compose.yml -f docker-compose.sign-in.yml config --quiet
          if docker compose -f docker-compose.yml -f docker-compose.sign-in.yml config --quiet 2>/dev/null; then echo "sign-in override must require SAMURAIBFF_AUTH_ISSUER"; exit 1; fi
          docker compose -f docker-compose.yml -f docker-compose.whisper.yml -f docker-compose.observability.yml -f docker-compose.whisper-observability.yml config --quiet

      - name: Reject mutable latest tags
        run: |
          images="$({ docker compose config --images; docker compose -f docker-compose.yml -f docker-compose.whisper.yml config --images; docker compose -f docker-compose.yml -f docker-compose.observability.yml config --images; } | sort -u)"
          printf '%s\n' "$images"
          if printf '%s\n' "$images" | grep -E ':latest$'; then
            echo "Compose and workflow images must use explicit versions."
            exit 1
          fi

      - name: Validate shell and Python syntax
        run: |
          find . -type f -name '*.sh' -print0 | xargs -0 -r bash -n
          python -m compileall -q utilities proto_gen smoke-tests

      - name: Check smoke-test entry points
        run: |
          python -m pip install -r utilities/k8s_local_smoke_test/requirements.txt
          python -m pip install -r utilities/k8s_local_smoke_test/requirements.kafka.txt
          python utilities/k8s_local_smoke_test/tier1_bff_connectivity.py --help
          python utilities/k8s_local_smoke_test/tier2_realtime_asr.py --help
          python utilities/k8s_local_smoke_test/tier3_kafka_audio_raw.py --help
          python utilities/k8s_local_smoke_test/tier4_async_pipeline.py --help
          python utilities/k8s_local_smoke_test/kafka_traceparent_audit.py --help

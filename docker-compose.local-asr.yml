# Source-built local E2E images. Use after docker-compose.nemotron.yml.
services:
  samuraibff:
    image: samuraibff:local-e2e
  samuraipersistor:
    image: samuraipersistor:local-e2e
  rtservice:
    image: xamurai-rtservice:local-e2e
  nemotron-rtservice:
    image: xamurai-nemotron-rtservice:local-e2e
    environment:
      NEMOTRON_DIARIZATION: 'true'
      ENROLL_BACKEND: s3_manifest
  nemotron-probe:
    image: xamurai-nemotron-rtservice:local-e2e
  whisperx_worker:
    image: xamurai-whisperx-worker:local-e2e
  recorder_worker:
    image: xamurai-recorder-worker:local-e2e
  finalizer_worker:
    image: xamurai-finalizer-worker:local-e2e
